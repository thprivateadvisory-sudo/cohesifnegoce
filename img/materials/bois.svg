<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" role="img" aria-label="Bois de structure — sections de poutres et chevrons empilés, montrant le veinage du bois">
  <defs>
    <linearGradient id="boisBg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#e7d2af"/>
      <stop offset="1" stop-color="#9c7c52"/>
    </linearGradient>
    <radialGradient id="ringA" cx="0.4" cy="0.4" r="0.7">
      <stop offset="0" stop-color="#f1ddbd"/>
      <stop offset="1" stop-color="#b9905f"/>
    </radialGradient>
    <radialGradient id="ringB" cx="0.4" cy="0.4" r="0.7">
      <stop offset="0" stop-color="#e3c79a"/>
      <stop offset="1" stop-color="#a37c4d"/>
    </radialGradient>
  </defs>
  <rect width="400" height="300" fill="url(#boisBg)"/>

  <!-- stacked beam ends, end-grain view with growth rings -->
  <g stroke="#7a5c39" stroke-width="2">
    <rect x="34" y="170" width="100" height="100" rx="6" fill="url(#ringA)"/>
    <g fill="none" stroke="#a8784a" stroke-width="2.5" opacity="0.55">
      <ellipse cx="84" cy="220" rx="14" ry="14"/>
      <ellipse cx="84" cy="220" rx="26" ry="26"/>
      <ellipse cx="84" cy="220" rx="38" ry="38"/>
    </g>

    <rect x="150" y="150" width="110" height="120" rx="6" fill="url(#ringB)"/>
    <g fill="none" stroke="#8a6840" stroke-width="2.5" opacity="0.5">
      <ellipse cx="205" cy="210" rx="16" ry="16"/>
      <ellipse cx="205" cy="210" rx="30" ry="30"/>
      <ellipse cx="205" cy="210" rx="44" ry="44"/>
    </g>

    <rect x="278" y="186" width="92" height="84" rx="6" fill="url(#ringA)"/>
    <g fill="none" stroke="#a8784a" stroke-width="2.5" opacity="0.55">
      <ellipse cx="324" cy="228" rx="12" ry="12"/>
      <ellipse cx="324" cy="228" rx="23" ry="23"/>
      <ellipse cx="324" cy="228" rx="34" ry="34"/>
    </g>
  </g>

  <!-- long chevron / beam laid across, showing side grain (straight lines) -->
  <g>
    <rect x="30" y="60" width="340" height="46" rx="4" fill="#caa476" stroke="#7a5c39" stroke-width="2"/>
    <g stroke="#8a6840" stroke-width="1.6" opacity="0.45">
      <path d="M30 72 q170 10 340 -2" fill="none"/>
      <path d="M30 86 q170 12 340 -4" fill="none"/>
      <path d="M30 98 q170 8 340 -2" fill="none"/>
    </g>
  </g>

  <text x="20" y="294" font-family="Georgia, serif" font-size="13" fill="#5b4326" opacity="0.75">Bois de structure — coupes et sections</text>
</svg>
