<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" role="img" aria-label="Fixations — vis à bois, boulons hexagonaux et chevilles, avec le filetage caractéristique des fixations métalliques">
  <defs>
    <linearGradient id="fixBg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#aab2bb"/>
      <stop offset="1" stop-color="#454c54"/>
    </linearGradient>
    <linearGradient id="metalRod" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#eef1f3"/>
      <stop offset="0.5" stop-color="#aab4bc"/>
      <stop offset="1" stop-color="#717b84"/>
    </linearGradient>
  </defs>
  <rect width="400" height="300" fill="url(#fixBg)"/>

  <!-- wood screw, diagonal, with thread -->
  <g transform="translate(70,70) rotate(28)">
    <rect x="0" y="0" width="14" height="150" rx="3" fill="url(#metalRod)" stroke="#3c434a" stroke-width="1.6"/>
    <g stroke="#3c434a" stroke-width="1.4" opacity="0.55">
      <path d="M0 56 q7 6 14 0 M0 70 q7 6 14 0 M0 84 q7 6 14 0 M0 98 q7 6 14 0 M0 112 q7 6 14 0 M0 126 q7 6 14 0 M0 140 q7 6 14 0" fill="none"/>
    </g>
    <path d="M0 150 L7 172 L14 150 Z" fill="url(#metalRod)" stroke="#3c434a" stroke-width="1.6"/>
    <circle cx="7" cy="-10" r="15" fill="url(#metalRod)" stroke="#3c434a" stroke-width="1.6"/>
    <path d="M-2 -10 H16 M7 -19 V-1" stroke="#3c434a" stroke-width="2"/>
  </g>

  <!-- hex bolt -->
  <g transform="translate(214,54)">
    <path d="M26 0 L52 15 L52 45 L26 60 L0 45 L0 15 Z" fill="url(#metalRod)" stroke="#3c434a" stroke-width="2"/>
    <circle cx="26" cy="30" r="10" fill="#5f6970" opacity="0.5"/>
    <rect x="14" y="60" width="24" height="120" rx="2" fill="url(#metalRod)" stroke="#3c434a" stroke-width="1.6"/>
    <g stroke="#3c434a" stroke-width="1.3" opacity="0.5">
      <path d="M14 78 h24 M14 92 h24 M14 106 h24 M14 120 h24 M14 134 h24 M14 148 h24 M14 162 h24" fill="none"/>
    </g>
  </g>

  <!-- nylon wall plug (cheville) -->
  <g transform="translate(312,118)">
    <path d="M16 0 H40 L48 18 L40 150 a8 8 0 0 1 -16 0 L16 18 Z" fill="#dbe0e4" stroke="#3c434a" stroke-width="1.8"/>
    <g stroke="#aab2bb" stroke-width="1.4" opacity="0.7">
      <path d="M18 30 H38 M19 50 H37 M20 70 H36 M21 90 H35 M22 110 H34" />
    </g>
  </g>

  <text x="20" y="290" font-family="Georgia, serif" font-size="13" fill="#22272c" opacity="0.75">Fixations — vis, boulons et chevilles</text>
</svg>
