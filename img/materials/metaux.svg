<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" role="img" aria-label="Métaux — profilés acier en I, tubes carrés et ronds à béton, finition acier brossé">
  <defs>
    <linearGradient id="metBg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#c4d2dc"/>
      <stop offset="1" stop-color="#5d7184"/>
    </linearGradient>
    <linearGradient id="steelShine" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#eef3f6"/>
      <stop offset="0.5" stop-color="#9fb1bd"/>
      <stop offset="1" stop-color="#6b7e8e"/>
    </linearGradient>
  </defs>
  <rect width="400" height="300" fill="url(#metBg)"/>

  <!-- I-beam cross-section -->
  <g transform="translate(46,150)" stroke="#3f4f5c" stroke-width="2.5">
    <path d="M0 0 H100 V18 H62 V96 H100 V114 H0 V96 H38 V18 H0 Z" fill="url(#steelShine)"/>
  </g>

  <!-- square hollow tube -->
  <g transform="translate(176,168)" stroke="#3f4f5c" stroke-width="2.5">
    <rect x="0" y="0" width="92" height="92" rx="6" fill="url(#steelShine)"/>
    <rect x="16" y="16" width="60" height="60" rx="4" fill="#5d7184"/>
  </g>

  <!-- rebar / rond a beton, ribbed -->
  <g transform="translate(296,84)" stroke="#3f4f5c" stroke-width="2">
    <rect x="0" y="0" width="16" height="190" rx="8" fill="url(#steelShine)"/>
    <g stroke="#46566f" stroke-width="1.6" opacity="0.5">
      <path d="M-2 14 h20 M-2 34 h20 M-2 54 h20 M-2 74 h20 M-2 94 h20 M-2 114 h20 M-2 134 h20 M-2 154 h20 M-2 174 h20" stroke="#3f4f5c"/>
    </g>
  </g>
  <g transform="translate(322,76)" stroke="#3f4f5c" stroke-width="2">
    <rect x="0" y="0" width="16" height="198" rx="8" fill="#7d92a0"/>
    <path d="M-2 14 h20 M-2 34 h20 M-2 54 h20 M-2 74 h20 M-2 94 h20 M-2 114 h20 M-2 134 h20 M-2 154 h20 M-2 174 h20" stroke="#46566f" stroke-width="1.6" opacity="0.45"/>
  </g>

  <!-- angle profile -->
  <g transform="translate(46,76)" stroke="#3f4f5c" stroke-width="2.5">
    <path d="M0 0 H78 V16 H16 V70 H0 Z" fill="#cdd9e1"/>
  </g>

  <text x="20" y="290" font-family="Georgia, serif" font-size="13" fill="#33424d" opacity="0.8">Métaux — profilés, tubes et ronds à béton</text>
</svg>
